key: "torrentkitty"
name: "TorrentKitty"
rate_limit: 2s
description: "TorrentKitty is a Public DHT search engine (magnets only)"
type: "public"
enabled: "false"
language: "en-US"
schedule: "@hourly"
settings:
  - name: use_flaresolverr
    type: checkbox
    label: Use FlareSolverr
    default: 'false'
search:
  type: "html"
  urls:
    - "https://www.torrentkitty.cam/search/{{if .Query}}{{.Query}}{{else}}2026{{end}}/"
    - "https://www.torrentkitty.ink/search/{{if .Query}}{{.Query}}{{else}}2026{{end}}/"
  results:
    rows_selector: 'table#archiveResult tbody tr:has(a[href^="magnet:?xt="])'
    fields:
      title:
        selector: "td.name"
      details_url:
        selector: "td.action a@href"
      download_url:
        selector: 'a[href^="magnet:?xt="]@href'
      seeders:
        text: "1"
      leechers:
        text: "0"
      publish_date:
        selector: "td.date"
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]
category_mappings:
  - indexer_cat: "Other"
    torznab_cat: 8000
