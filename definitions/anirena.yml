---
# Converted from Scarf's own format (phase 4). Not in Prowlarr/Indexers.
id: anirena
name: AniRena
description: "AniRena is a Public torrent tracker for the latest anime and Japanese related torrents"
language: en-US
type: public
encoding: UTF-8
requestDelay: 2
links:
  - https://www.anirena.com/

caps:
  categorymappings:
    - {id: 1, cat: TV/Anime, desc: Anime Series}
    - {id: 2, cat: TV/Anime, desc: Anime Movie}
    - {id: 3, cat: TV/Anime, desc: Anime OVA}
    - {id: 4, cat: TV/Anime, desc: Anime Raw}
    - {id: 9, cat: TV/Anime, desc: Hentai}
    - {id: 10, cat: TV/Anime, desc: Live Action}
    - {id: 5, cat: PC/Games, desc: Games}
    - {id: 6, cat: PC, desc: Software}
    - {id: 7, cat: Books, desc: Manga}
    - {id: 8, cat: Audio, desc: Music}
    - {id: 11, cat: Other, desc: Other}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    music-search: [q]
    book-search: [q]

settings: []

search:
  paths:
    - path: /
  inputs:
    q: "{{ .Keywords }}"
  rows:
    selector: table.tl-table tr[data-torrent-id]
  fields:
    category:
      text: 1
    title:
      selector: a.tl-torrent-name
    details:
      selector: a.tl-torrent-name
      attribute: href
    download:
      selector: a[title="Download Torrent"]
      attribute: href
    size:
      selector: .tl-meta-size
    seeders:
      selector: .tl-se
    leechers:
      selector: .tl-le
    date:
      selector: .tl-meta-date span[data-utc]
      filters:
        - name: dateparse
          args: "yyyy-MM-dd HH:mm"
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
