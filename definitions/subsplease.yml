---
# Converted from Scarf's own format (phase 4). Jackett implements SubsPlease
# in C#; this uses the site's JSON API. Each entry carries one magnet per
# resolution, expanded through rows.attribute + multiple.
id: subsplease
name: SubsPlease
description: "SubsPlease is a Public anime release group with same-day simulcast rips"
language: en-US
type: public
encoding: UTF-8
requestDelay: 2
links:
  - https://subsplease.org/

caps:
  categorymappings:
    - {id: anime, cat: TV/Anime, desc: Anime}
  modes:
    search: [q]
    tv-search: [q, season, ep]

settings: []

search:
  paths:
    - path: api/
      response:
        type: json
  inputs:
    f: search
    tz: UTC
    s: "{{ .Keywords }}"
  rows:
    selector: $
    attribute: downloads
    multiple: true
  fields:
    category:
      text: anime
    show:
      selector: ..show
    episode:
      selector: ..episode
    res:
      selector: res
    title:
      text: "[SubsPlease] {{ .Result.show }} - {{ .Result.episode }} ({{ .Result.res }}p)"
    download:
      selector: magnet
    date:
      selector: ..release_date
    # The API has no swarm stats; a constant keeps min-seeder filters
    # downstream from dropping every result.
    seeders:
      text: 1
    leechers:
      text: 0
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
