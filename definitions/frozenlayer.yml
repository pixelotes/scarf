---
# Converted from Scarf's own format (phase 4). Not in Prowlarr/Indexers.
id: frozenlayer
name: Frozen Layer
description: "Frozen Layer is a SPANISH Public torrent site focused on ANIME"
language: es-ES
type: public
encoding: UTF-8
requestDelay: 2
links:
  - https://www.frozen-layer.com/

caps:
  categorymappings:
    - {id: Anime, cat: TV/Anime, desc: Anime}
    - {id: Manga, cat: Books/Comics, desc: Manga}
    - {id: Dorama, cat: TV, desc: Dorama}
    - {id: Videojuego, cat: PC/Games, desc: Videojuego}
    - {id: Bso, cat: Audio, desc: BSO}
    - {id: Pv, cat: Audio/Video, desc: PV}
    - {id: Otros, cat: Other, desc: Otros}
  modes:
    search: [q]
    tv-search: [q, season, ep]

settings: []

search:
  paths:
    - path: "buscar/descargas/todos/{{ .Keywords }}"
  inputs:
    search: Buscar
  rows:
    selector: "table#descargas > tbody > tr:has(td > a[href^='magnet:?'])"
  fields:
    category:
      text: Anime
    title:
      selector: td.tit a
    details:
      selector: td.tit a
      attribute: href
    download:
      selector: td:nth-child(1) a[href^="magnet:?"]
      attribute: href
    size:
      selector: td:nth-child(6)
    seeders:
      selector: td:nth-child(7)
    leechers:
      selector: td:nth-child(8)
    date:
      selector: td.fecha
      filters:
        - name: fuzzytime
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
