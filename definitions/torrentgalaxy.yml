---
# Converted from Scarf's own format (phase 4). Not in Prowlarr/Indexers
# (Prowlarr's torrentgalaxy targets the old site).
id: torrentgalaxy
name: TorrentGalaxy
description: "TorrentGalaxy is a Public site for MOVIES / TV / GENERAL"
language: en-US
type: public
encoding: UTF-8
requestDelay: 2
links:
  - https://torrentgalaxy.one/
  - https://torrentgalaxy.info/
  - https://torrentgalaxy.space/

caps:
  categorymappings:
    - {id: Movies, cat: Movies, desc: Movies}
    - {id: TV, cat: TV, desc: TV}
    - {id: Docus, cat: TV/Documentary, desc: Documentaries}
    - {id: Games, cat: PC/Games, desc: Games}
    - {id: Music, cat: Audio, desc: Music}
    - {id: Anime, cat: TV/Anime, desc: Anime}
    - {id: Apps, cat: PC, desc: Apps}
    - {id: Books, cat: Books, desc: Books}
    - {id: XXX, cat: XXX, desc: XXX}
    - {id: Other, cat: Other, desc: Other}
  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]
    music-search: [q]
    book-search: [q]

settings: []

search:
  paths:
    - path: "get-posts/{{ if .Keywords }}keywords:{{ .Keywords }}{{ else }}time:10D{{ end }}{{ if .Categories }}:category:{{ join .Categories \",\" }}{{ end }}"
  keywordsfilters:
    - name: replace
      args: [":", " "]
  rows:
    selector: div.tgxtablerow
  fields:
    category:
      text: Other
    title:
      selector: a[href^='/post-detail/']
      attribute: title
    details:
      selector: a[href^='/post-detail/']
      attribute: href
    download:
      selector: a[href^='magnet:?xt=']
      attribute: href
    size:
      selector: div.tgxtablecell:nth-last-child(5) span
    seeders:
      selector: div.tgxtablecell:nth-last-child(2) span font:nth-of-type(1)
    leechers:
      selector: div.tgxtablecell:nth-last-child(2) span font:nth-of-type(2)
    date:
      selector: div.tgxtablecell:nth-last-child(1)
      remove: div.bighide
      # "4 Mins ago" for recent posts, "23/04/26 12:56" (dd/MM/yy) for older ones.
      filters:
        - name: re_replace
          args: ["^(\\d{2})\\/(\\d{2})\\/(\\d{2}) ", "20$3-$2-$1 "]
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
