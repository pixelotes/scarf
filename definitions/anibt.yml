key: "anibt"
name: "AniBT"
rate_limit: 2s
description: "AniBT is a Public anime tracker"
type: "public"
enabled: "false"
language: "en-US"
schedule: "@hourly"
health_check:
  query: "frieren"
settings:
  - name: use_flaresolverr
    type: checkbox
    label: Use FlareSolverr
    default: 'false'
search:
  # RSS feed with a q= filter, parsed with the HTML parser (tags lowercased).
  type: "html"
  urls:
    - "https://anibt.net/rss/magnets.xml?q={{.Query}}"
  results:
    # Plain "item": the CDATA-wrapped HTML in <description> is parsed as real
    # HTML and breaks the rss > channel > item nesting.
    rows_selector: "item"
    fields:
      title:
        selector: "title"
      download_url:
        selector: "enclosure@url"
      size:
        selector: "enclosure@length"
      seeders:
        text: "1"
      leechers:
        text: "0"
      publish_date:
        # Items also carry an ISO pubDate inside <torrent>; take the RSS one.
        selector: "guid + pubdate"
  modes:
    search: [q]
    tv-search: [q, season, ep]
category_mappings:
  - indexer_cat: "anime"
    torznab_cat: 5080
