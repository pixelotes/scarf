---
# Converted from Scarf's own format (phase 4). Not in Prowlarr/Indexers.
id: therarbg
name: TheRARBG
description: "A Public site inspired by RARBG.to for MOVIES / TV / GENERAL"
language: en-US
type: public
encoding: UTF-8
requestDelay: 2
links:
  - https://therarbg.to/
  - https://therarbg.com/

caps:
  categorymappings:
    - {id: Movies, cat: Movies, desc: Movies}
    - {id: TV, cat: TV, desc: TV}
    - {id: Games, cat: PC/Games, desc: Games}
    - {id: Music, cat: Audio, desc: Music}
    - {id: Anime, cat: TV/Anime, desc: Anime}
    - {id: Documentaries, cat: Movies/Other, desc: Documentaries}
    - {id: Apps, cat: PC, desc: Apps}
    - {id: Other, cat: Other, desc: Other}
    - {id: Books, cat: Books, desc: Books}
    - {id: XXX, cat: XXX, desc: XXX}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]
    music-search: [q]
    book-search: [q]

settings: []

search:
  paths:
    - path: "get-posts/order:-a{{ if .Categories }}:category:{{ join .Categories \",\" }}{{ end }}{{ if .Keywords }}:keywords:{{ .Keywords }}{{ else }}:time:10D{{ end }}:paginate_by:100:format:json/"
      response:
        type: json
  keywordsfilters:
    - name: replace
      args: [":", " "]
  rows:
    selector: results
  fields:
    category:
      selector: c
      optional: true
      default: Other
    title:
      selector: n
    infohash:
      selector: h
    download:
      text: "magnet:?xt=urn:btih:{{ .Result.infohash }}&dn={{ .Result.title }}"
    size:
      selector: s
    seeders:
      selector: se
    leechers:
      selector: le
    date:
      selector: a
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
