key: "acgrip"
name: "ACG.RIP"
rate_limit: 2s
description: "ACG.RIP is a Public anime tracker (Chinese/Japanese releases)"
type: "public"
enabled: "false"
language: "zh-CN"
schedule: "@hourly"
health_check:
  query: "frieren"
settings:
  - name: use_flaresolverr
    type: checkbox
    label: Use FlareSolverr
    default: 'false'
search:
  type: "html"
  urls:
    - "https://acg.rip/?term={{.Query}}"
  results:
    rows_selector: "tbody tr:has(td.title)"
    fields:
      title:
        selector: "td.title > span.title a"
      details_url:
        selector: "td.title > span.title a@href"
      download_url:
        selector: "td.action a@href"
      size:
        selector: "td.size"
      seeders:
        text: "1"
      leechers:
        text: "0"
      publish_date:
        selector: "td.date time@datetime"
  modes:
    search: [q]
    tv-search: [q, season, ep]
category_mappings:
  - indexer_cat: "anime"
    torznab_cat: 5080
