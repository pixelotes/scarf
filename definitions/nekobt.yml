key: "nekobt"
name: "nekoBT"
rate_limit: 2s
# Replaces Anime Tosho (shut down). Uses nekoBT's public Torznab API; the
# API key is optional and only needed for account-specific filtering.
description: "nekoBT is a Public anime tracker with rich release metadata"
type: "public"
enabled: "false"
language: "en-US"
schedule: "@hourly"
health_check:
  query: "frieren"
settings:
  - name: use_flaresolverr
    type: checkbox
    label: Use FlareSolverr
    default: 'false'
search:
  # Torznab XML, parsed with the HTML parser: tag names are lowercased
  # (pubDate -> pubdate) and torznab:attr is matched by its name attribute.
  type: "html"
  urls:
    - "https://nekobt.to/api/torznab/api?t=search&q={{.Query}}&limit=100"
  results:
    rows_selector: "rss > channel > item"
    fields:
      title:
        selector: "title"
      details_url:
        selector: "comments"
      download_url:
        selector: "enclosure@url"
      size:
        selector: "size"
      seeders:
        selector: "[name=seeders]@value"
      leechers:
        selector: "[name=leechers]@value"
      publish_date:
        selector: "pubdate"
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
category_mappings:
  - indexer_cat: "5070"
    torznab_cat: 5080
  - indexer_cat: "2000"
    torznab_cat: 2000
